services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eshitaman-postgres
    restart: always
    environment:
      POSTGRES_DB: eshitaman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_create_rag_chunks.sql:/docker-entrypoint-initdb.d/001_create_rag_chunks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshitaman"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
